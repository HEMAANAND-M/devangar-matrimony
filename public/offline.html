<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#5e1229" />
    <title>You are offline · Devangar Matrimony</title>
    <style>
      :root { color-scheme: light; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #faf7f1; color: #1e1a17;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Tamil", sans-serif; }
      main { max-width: 28rem; padding: 2rem 1.5rem; text-align: center; }
      .mark { width: 64px; height: 64px; margin: 0 auto 1.25rem; border-radius: 9999px; display: grid; place-items: center;
        background: #5e1229; color: #e9dcc3; font: 600 28px Georgia, serif; }
      h1 { margin: 0 0 .5rem; font: 600 1.75rem Georgia, "Noto Serif Tamil", serif; color: #5e1229; }
      p { margin: .25rem 0; line-height: 1.6; color: #57534e; }
      .retry { display: inline-block; margin-top: 1.5rem; border-radius: 9999px; padding: .75rem 1.75rem; background: #5e1229; color: #fff; text-decoration: none;
        font-size: .95rem; font-weight: 600; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">D</div>
      <h1>You are offline</h1>
      <p>Please check your internet connection and try again.</p>
      <p lang="ta">இணைய இணைப்பு இல்லை. இணைப்பைச் சரிபார்த்து மீண்டும் முயலுங்கள்.</p>
      <a class="retry" href="/">Try again · மீண்டும் முயல்க</a>
    </main>
  </body>
</html>
