version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Patch and minor updates arrive as one weekly PR.
      minor-and-patch:
        update-types: [minor, patch]
    # Major upgrades (Next, Prisma, TypeScript…) need code changes; plan them by hand.
    # Security updates are still raised regardless of this rule.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
