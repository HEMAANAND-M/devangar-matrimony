name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: devangar_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:ci_password@localhost:5432/devangar_ci
      SESSION_SECRET: ci-only-session-secret-at-least-32-characters
      DATA_ENCRYPTION_KEY: ci-only-data-encryption-key-at-least-32-chars
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Dependency audit (runtime packages)
        run: npm audit --omit=dev --audit-level=high
      - run: npx prisma migrate deploy
      - run: npm run typecheck
      - run: npm run lint
      # The build downloads Google Fonts; retry once so a network blip does not fail CI.
      - run: npm run build || npm run build
